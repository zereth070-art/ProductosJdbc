spring.application.name=productosJdbc

# --- Base de datos H2 en fichero ---
# AUTO_SERVER permite que la app y la herramienta Database de IntelliJ
# se conecten a la vez a la misma base de datos.
spring.datasource.url=jdbc:h2:file:./data/logisticadb;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Ejecutar schema.sql y data.sql al arrancar (por defecto ya lo hace con BD embebidas)
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8

# --- Consola H2 ---
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
